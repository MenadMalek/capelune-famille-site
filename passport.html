<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0db"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png" type="image/png"><title>Passeport de l’enfant — Capelune Famille</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#203246;background:#f5f8fb}*{box-sizing:border-box}body{margin:0}header{background:#234b78;color:#fff;padding:1rem max(1rem,calc((100vw - 950px)/2))}header a{color:white}header h1{font-size:1.5rem;margin:.6rem 0 .2rem}header p{margin:.2rem 0;color:#e6eef8}main{max-width:950px;margin:auto;padding:1rem 1rem 4rem}.panel{background:#fff;border:1px solid #d9e4ef;border-radius:15px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 3px 15px #234b7808}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1rem}h2{font-size:1.15rem;margin:0 0 1rem}label{display:block;font-weight:600;margin:.8rem 0 .35rem}input,textarea{font:inherit;border:1px solid #a9bacb;border-radius:8px;padding:.65rem;width:100%;background:#fff;color:#203246}textarea{min-height:110px;resize:vertical}button{font:inherit;cursor:pointer;border:0;border-radius:8px;background:#234b78;color:#fff;padding:.65rem .9rem;font-weight:600}button.secondary{background:#e6eef7;color:#234b78}button.danger{background:#9d3340}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.saved-row{display:flex;gap:.5rem;margin:.5rem 0;flex-wrap:wrap}.muted{color:#586c7e;line-height:1.5}.status{min-height:1.4rem;font-weight:600}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #e0a64c;outline-offset:2px}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media print{header,.controls,.notice,.status{display:none!important}}
</style><link rel="stylesheet" href="family-theme.css"><script src="android-bridge.js"></script></head><body data-family-tool="passport"><header><a href="index.html">← Accueil Famille</a><h1><span class="tool-title-icon" aria-hidden="true">💛</span>Passeport de l’enfant</h1><p>Les repères utiles à transmettre, en quelques mots.</p><span class="header-sun" aria-hidden="true">☀️</span></header><main>
<p class="notice muted">Prototype local : utilisez uniquement des données fictives. Chaque rubrique est facultative. N’inscrivez que ce que vous souhaitez partager dans le PDF.</p>
<section class="panel controls"><h2>Passeports enregistrés</h2><div id="saved" class="muted"></div><div class="actions"><button id="new" class="secondary" type="button">Nouveau passeport</button><button id="export" class="secondary" type="button">Télécharger une copie</button><button id="import" class="secondary" type="button">Importer une copie</button><input id="file" type="file" accept="application/json,.json" hidden></div></section>
<section class="panel"><h2>Mes repères</h2><label for="nickname">Prénom ou surnom (facultatif)</label><input id="nickname" maxlength="60" placeholder="Ex. Sam"><div class="grid">
<div><label for="communication">Comment je communique</label><textarea id="communication" maxlength="500" placeholder="Mots, gestes, pictogrammes, façons de demander de l’aide…"></textarea></div>
<div><label for="likes">Ce que j’aime</label><textarea id="likes" maxlength="500" placeholder="Activités, personnes, objets, habitudes…"></textarea></div>
<div><label for="difficulties">Ce qui peut être difficile</label><textarea id="difficulties" maxlength="500" placeholder="Bruit, attente, changements…"></textarea></div>
<div><label for="helps">Ce qui m’aide</label><textarea id="helps" maxlength="500" placeholder="Prévenir, montrer, faire une pause…"></textarea></div>
<div><label for="signs">Mes signes de surcharge</label><textarea id="signs" maxlength="500" placeholder="Ce que l’on peut observer avant que cela devienne trop difficile…"></textarea></div>
<div><label for="other">Informations utiles à partager</label><textarea id="other" maxlength="500" placeholder="Autres repères concrets pour les proches ou l’école…"></textarea></div></div>
<div class="actions controls"><button id="save" type="button">Enregistrer</button><button id="preview" class="secondary" type="button">Aperçu avant impression</button><button id="pdf" class="secondary" type="button">Télécharger le PDF</button></div></section><p id="status" class="status" role="status" aria-live="polite"></p>
</main><script src="pdf-fonts.js"></script><script src="pdf-renderer.js"></script><script src="pdf-export.js"></script><script>
'use strict';
const KEY='capelune-family-passport-v1',FIELDS=['nickname','communication','likes','difficulties','helps','signs','other'],$=id=>document.getElementById(id);
const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2);
const fresh=()=>({id:uid(),nickname:'',communication:'',likes:'',difficulties:'',helps:'',signs:'',other:''});
let passports=[],current=fresh(),loadError=false;
function say(message){$('status').textContent=message}
function valid(p){return p&&typeof p.id==='string'&&FIELDS.every(k=>typeof p[k]==='string'&&p[k].length<=(k==='nickname'?60:500))}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return[];const data=JSON.parse(raw);if(!Array.isArray(data)||data.length>20||!data.every(valid))throw Error('format');return data}catch{loadError=true;say('Stockage local illisible. Aucun passeport n’a été remplacé.');return[]}}
function persist(next,recover=false){if(loadError&&!recover){say('Stockage illisible : importez une copie valide avant d’enregistrer.');return false}try{localStorage.setItem(KEY,JSON.stringify(next));passports=next;loadError=false;return true}catch{say('Enregistrement impossible. Téléchargez une copie avant de fermer la page.');return false}}
function sync(){for(const k of FIELDS)current[k]=$(k).value.trim()}
function render(){for(const k of FIELDS)$(k).value=current[k];const saved=$('saved');saved.replaceChildren();if(!passports.length){saved.textContent='Aucun passeport enregistré.';return}passports.forEach(p=>{const row=document.createElement('div');row.className='saved-row';const open=document.createElement('button');open.type='button';open.className='secondary';open.textContent=p.nickname||'Passeport sans prénom';open.addEventListener('click',()=>{current=structuredClone(p);render();say('Passeport ouvert.')});const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Supprimer';del.setAttribute('aria-label','Supprimer le passeport '+(p.nickname||'sans prénom'));del.addEventListener('click',()=>{if(!confirm('Supprimer ce passeport enregistré ?'))return;const next=passports.filter(x=>x.id!==p.id);if(persist(next)){if(current.id===p.id)current=fresh();render();say('Passeport supprimé.')}});row.append(open,del);saved.append(row)})}
$('new').addEventListener('click',()=>{current=fresh();render();say('Nouveau passeport prêt.')});
$('save').addEventListener('click',()=>{sync();if(!FIELDS.slice(1).some(k=>current[k])){say('Remplissez au moins une rubrique avant d’enregistrer.');return}const next=[...passports.filter(p=>p.id!==current.id),structuredClone(current)];if(next.length>20){say('Limite de 20 passeports atteinte.');return}if(persist(next)){render();say('Passeport enregistré sur cet appareil.')}});
$('preview').addEventListener('click',async()=>{sync();const b=$('preview');b.disabled=true;try{await CapelunePdf.downloadPassport(structuredClone(current),true);say('Aperçu ouvert. Choisissez Imprimer ou Télécharger le PDF.')}catch{say('L’aperçu n’a pas pu être créé.')}finally{b.disabled=false}});
$('pdf').addEventListener('click',async()=>{sync();const b=$('pdf');b.disabled=true;try{await CapelunePdf.downloadPassport(structuredClone(current));say('PDF téléchargé sur cet appareil.')}catch{say('Le PDF n’a pas pu être créé.')}finally{b.disabled=false}});
$('export').addEventListener('click',()=>{if(!passports.length){say('Aucun passeport à sauvegarder.');return}const blob=new Blob([JSON.stringify({format:KEY,version:1,passports},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='capelune-famille-passeports.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);say('Copie téléchargée. Le fichier n’est pas chiffré.')});
$('import').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',async()=>{const file=$('file').files[0];$('file').value='';if(!file)return;if(file.size>2_000_000){say('Fichier trop volumineux.');return}try{const data=JSON.parse(await file.text());if(data.format!==KEY||data.version!==1||!Array.isArray(data.passports)||data.passports.length>20||!data.passports.every(valid))throw Error('format');if(!confirm('Remplacer tous les passeports locaux par ceux du fichier ?'))return;const copy=structuredClone(data.passports);if(persist(copy,true)){current=copy[0]?structuredClone(copy[0]):fresh();render();say('Passeports importés.')}}catch{say('Fichier invalide. Aucun passeport remplacé.')}});
passports=load();render();
</script><script src="pwa.js"></script></body></html>
